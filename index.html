<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<title>Courier DO · Kyiv & Zaporizhia</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2129;
    --line: #2a313c;
    --text: #e6edf3;
    --muted: #8b96a3;
    --accent: #4f9dff;
    --accent-2: #ffb54f;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter",
                 "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.5;
    padding: 24px 32px 64px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 16px; margin: 0 0 12px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .section-title {
    font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.08em; margin: 28px 0 10px;
  }

  .city-tabs {
    display: inline-flex; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 4px; margin-bottom: 24px; gap: 2px;
  }
  .city-tab {
    background: transparent; border: 0; color: var(--text);
    padding: 8px 18px; border-radius: 7px; cursor: pointer;
    font-size: 14px; font-weight: 500; transition: all 0.15s;
  }
  .city-tab:hover { background: var(--panel-2); }
  .city-tab.active { background: var(--accent); color: #0b1117; }

  .kpis {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
    margin-bottom: 8px;
  }
  @media (max-width: 1300px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
    cursor: pointer; transition: all 0.15s;
  }
  .kpi:hover { border-color: #3a414c; }
  .kpi.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi .label .wd { color: var(--accent); font-weight: 600; }
  .kpi .value { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .kpi .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .weekrow { display: flex; gap: 4px; margin-bottom: 6px; flex-wrap: wrap; align-items: center; }
  .weekrow .week-label {
    color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.06em; margin-right: 4px; min-width: 64px;
  }
  .tab, .qf, .week-tab {
    background: var(--panel); border: 1px solid var(--line);
    color: var(--text); padding: 7px 12px; border-radius: 8px;
    cursor: pointer; font-size: 12px; font-weight: 500;
    transition: all 0.15s; display: inline-flex; align-items: center; gap: 6px;
  }
  .tab:hover, .qf:hover, .week-tab:hover { background: var(--panel-2); border-color: #3a414c; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #0b1117; }
  .week-tab.active { background: var(--accent-2); border-color: var(--accent-2); color: #0b1117; }
  .tab .wd { font-weight: 600; }
  .tab .dt { opacity: 0.7; font-size: 11px; }
  .tab.active .dt { opacity: 0.85; }
  .qf.primary { background: var(--accent); border-color: var(--accent); color: #0b1117; }

  .qf-row { display: flex; gap: 6px; margin: 12px 0 16px; flex-wrap: wrap; align-items: center; }
  .qf-sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px 18px;
  }
  .card-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
  .card-title .total { color: var(--muted); font-size: 12px; }
  .chart-wrap { position: relative; height: 280px; }

  table {
    width: 100%; border-collapse: collapse; margin-top: 12px;
    font-size: 12px;
  }
  th, td {
    text-align: right; padding: 6px 8px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  tr:last-child td { border-bottom: none; }
  td.pct { color: var(--muted); }
  .table-wrap { overflow-x: auto; margin-top: 8px; }

  .week-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px;
  }
  @media (max-width: 1300px) { .week-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 900px) { .week-grid { grid-template-columns: repeat(2, 1fr); } }
  .week-card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px;
    cursor: pointer; transition: all 0.15s;
  }
  .week-card:hover { border-color: #3a414c; }
  .week-card.selected { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2) inset; }
  .week-card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .week-card .label .num { color: var(--accent-2); font-weight: 600; }
  .week-card .value { font-size: 18px; font-weight: 600; margin-top: 2px; }
  .week-card .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

  .empty { color: var(--muted); padding: 32px; text-align: center; font-size: 13px; }
</style>
</head>
<body>
  <h1>Courier DO distribution</h1>
  <div class="sub" id="subline"></div>

  <div class="city-tabs" id="cityTabs"></div>

  <div id="cityContent"></div>

<template id="cityTemplate">
  <div class="city-view">
    <div class="section-title">Weekly totals · click any week card to select for compare</div>
    <div class="week-grid wgs"></div>
    <div class="qf-row wqf"></div>

    <div class="section-title weekly-section-title">Weekly comparison</div>
    <div class="grid">
      <div class="card">
        <div class="card-title">
          <h2>Weekly DO totals</h2>
          <div class="total weekly-totals-meta"></div>
        </div>
        <div class="chart-wrap"><canvas class="weeklyTotalsChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">
          <h2>Per-courier DO buckets · weeks side-by-side</h2>
          <div class="total weekly-bucket-meta"></div>
        </div>
        <div class="chart-wrap"><canvas class="weeklyBucketsChart"></canvas></div>
        <div class="table-wrap"><table class="weeklyBucketsTable"></table></div>
      </div>
    </div>

    <div class="section-title">Daily totals · click any card to toggle</div>
    <div class="kpis kpis-grid"></div>

    <div class="section-title">Day selector</div>
    <div class="weekTabs"></div>
    <div class="qf-row dqf"></div>

    <div class="section-title compare-title">Compare selected days</div>
    <div class="card">
      <div class="card-title">
        <h2>DO · Delivered orders per courier</h2>
        <div class="total compare-meta"></div>
      </div>
      <div class="chart-wrap"><canvas class="dailyCompareChart"></canvas></div>
      <div class="table-wrap"><table class="dailyCompareTable"></table></div>
    </div>

    <div class="section-title">All days · stacked share of DO buckets</div>
    <div class="card">
      <div class="card-title"><h2>DO bucket share by day</h2></div>
      <div class="chart-wrap" style="height:340px"><canvas class="stackedChart"></canvas></div>
    </div>
  </div>
</template>

<script>
const DATA = JSON.parse(document.getElementById("report-data").textContent);
const DO_BUCKETS = DATA.do_buckets;
const DO_SUMMARY_BUCKETS = DATA.do_summary_buckets;

const fmt = (n) => Number(n).toLocaleString("en-US");
const pct = (n, total) => total ? (n / total) * 100 : 0;
const pctStr = (n, total) => total ? ((n / total) * 100).toFixed(1) + "%" : "0.0%";

const PALETTE = ["#4f9dff", "#ffb54f", "#5fc88a", "#e35d6a", "#a78bfa", "#f0c33b", "#33c4d4", "#ff8585"];
const STACK_PALETTE = ["#6b7280", "#4f9dff", "#5fc88a", "#f0c33b", "#f08c33", "#e35d6a", "#a78bfa"];

Chart.defaults.color = "#8b96a3";
Chart.defaults.borderColor = "#2a313c";
Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif';
Chart.defaults.font.size = 12;

const cityState = new Map();

function shortDate(d) { return d.slice(5); }
function weekdayOf(city, d) { return city.weekday_map[d]; }

function initCity(city) {
  cityState.set(city.name, {
    selectedDays: new Set(),
    selectedWeeks: new Set(city.weeks.map(w => w.id)),
  });
}

function totalRange() {
  let mn = "9999-12-31", mx = "";
  DATA.cities.forEach(c => {
    if (c.dates[0] < mn) mn = c.dates[0];
    if (c.dates[c.dates.length - 1] > mx) mx = c.dates[c.dates.length - 1];
  });
  return [mn, mx];
}

function renderSubline() {
  const [a, b] = totalRange();
  document.getElementById("subline").textContent =
    `${DATA.cities.length} cities · range ${a} → ${b} · ` +
    `Active courier = courier with online hours > 0 that day · ` +
    `Click any card to toggle for comparison`;
}

function renderCityTabs() {
  const el = document.getElementById("cityTabs");
  el.innerHTML = DATA.cities.map((c, i) => `
    <button class="city-tab ${i === 0 ? "active" : ""}" data-city="${c.name}">
      ${c.name} <span style="opacity:0.6;font-weight:400">· ${c.dates.length}d / ${c.weeks.length}w</span>
    </button>
  `).join("");
  el.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".city-tab");
    if (!btn) return;
    document.querySelectorAll(".city-tab").forEach(t => t.classList.toggle("active", t === btn));
    showCity(btn.dataset.city);
  });
}

function destroyCharts(root) {
  root.querySelectorAll("canvas").forEach(c => {
    if (c._chart) { c._chart.destroy(); c._chart = null; }
  });
}

function newChart(canvas, config) {
  if (canvas._chart) canvas._chart.destroy();
  canvas._chart = new Chart(canvas, config);
  return canvas._chart;
}

function buildBucketTable(tableEl, buckets, columns, getCell, totals) {
  let html = `<thead><tr><th>Bucket</th>`;
  columns.forEach((col, i) => {
    html += `<th>${col.label}<br><span style="font-weight:400;text-transform:none;">${fmt(totals[i])} ${col.suffix || ""}</span></th>`;
  });
  html += `</tr></thead><tbody>`;
  buckets.forEach(b => {
    html += `<tr><td>${b}</td>`;
    columns.forEach((_col, i) => {
      const c = getCell(i, b);
      html += `<td>${fmt(c)} <span class="pct">${pctStr(c, totals[i])}</span></td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody>`;
  tableEl.innerHTML = html;
}

function renderWeeklyTotals(root, city) {
  const state = cityState.get(city.name);
  const wgs = root.querySelector(".wgs");
  wgs.innerHTML = city.weeks.map(w => `
    <div class="week-card" data-id="${w.id}">
      <div class="label"><span class="num">${w.label.split("·")[0].trim()}</span> · ${w.label.split("·")[1].trim()}</div>
      <div class="value">${fmt(Math.round(w.total_do))}</div>
      <div class="meta">DO total · ${fmt(w.total_active_couriers)} courier-days</div>
    </div>
  `).join("");
  wgs.addEventListener("click", (ev) => {
    const card = ev.target.closest(".week-card");
    if (!card) return;
    const id = card.dataset.id;
    if (state.selectedWeeks.has(id)) state.selectedWeeks.delete(id);
    else state.selectedWeeks.add(id);
    rerenderWeekly(root, city);
  });

  const wqf = root.querySelector(".wqf");
  wqf.innerHTML = `
    <button class="qf primary" data-action="all-weeks">All weeks</button>
    <button class="qf" data-action="last-3">Last 3 weeks</button>
    <button class="qf" data-action="last-2">Last 2 weeks</button>
    <button class="qf" data-action="clear-weeks">Clear</button>
  `;
  wqf.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".qf");
    if (!btn) return;
    const action = btn.dataset.action;
    const allIds = city.weeks.map(w => w.id);
    if (action === "all-weeks") state.selectedWeeks = new Set(allIds);
    else if (action === "last-3") state.selectedWeeks = new Set(allIds.slice(-3));
    else if (action === "last-2") state.selectedWeeks = new Set(allIds.slice(-2));
    else if (action === "clear-weeks") state.selectedWeeks = new Set();
    rerenderWeekly(root, city);
  });

  rerenderWeekly(root, city);
}

function rerenderWeekly(root, city) {
  const state = cityState.get(city.name);
  root.querySelectorAll(".week-card").forEach(el => {
    el.classList.toggle("selected", state.selectedWeeks.has(el.dataset.id));
  });

  const selectedWeeks = city.weeks.filter(w => state.selectedWeeks.has(w.id));
  const titleEl = root.querySelector(".weekly-section-title");
  titleEl.textContent = selectedWeeks.length === 0
    ? "Select at least one week"
    : `Weekly comparison · ${selectedWeeks.length} of ${city.weeks.length} weeks`;

  const wtCanvas = root.querySelector(".weeklyTotalsChart");
  const wbCanvas = root.querySelector(".weeklyBucketsChart");

  if (selectedWeeks.length === 0) {
    if (wtCanvas._chart) { wtCanvas._chart.destroy(); wtCanvas._chart = null; }
    if (wbCanvas._chart) { wbCanvas._chart.destroy(); wbCanvas._chart = null; }
    root.querySelector(".weeklyBucketsTable").innerHTML = "";
    return;
  }

  // Weekly totals chart
  const labels = selectedWeeks.map(w => w.label.split("·")[0].trim() + " · " + w.label.split("·")[1].trim());
  const totals = selectedWeeks.map(w => Math.round(w.total_do));
  newChart(wtCanvas, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "Total DO",
        data: totals,
        backgroundColor: PALETTE[0],
        borderRadius: 4,
        maxBarThickness: 50,
      }],
    },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: c => `${fmt(c.parsed.y)} DO` } },
      },
      scales: {
        x: { grid: { display: false }, ticks: { maxRotation: 30, minRotation: 0 } },
        y: { beginAtZero: true, grid: { color: "rgba(255,255,255,0.05)" }, ticks: { callback: v => fmt(v) } },
      },
    },
  });
  root.querySelector(".weekly-totals-meta").textContent =
    `Sum: ${fmt(totals.reduce((a,b) => a+b, 0))} DO across ${selectedWeeks.length} weeks`;

  // Weekly per-courier DO buckets - grouped chart
  const datasets = selectedWeeks.map((w, i) => {
    const total = sumValues(w.do_summary);
    const data = DO_SUMMARY_BUCKETS.map(b => w.do_summary[b] || 0);
    return {
      label: w.label.split("·")[0].trim(),
      data,
      backgroundColor: PALETTE[i % PALETTE.length],
      borderRadius: 4,
      maxBarThickness: 24,
      _pct: data.map(v => pctStr(v, total)),
    };
  });
  newChart(wbCanvas, {
    type: "bar",
    data: { labels: DO_SUMMARY_BUCKETS, datasets },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: { position: "bottom", labels: { boxWidth: 10, boxHeight: 10 } },
        tooltip: {
          callbacks: { label: c => `${c.dataset.label}: ${fmt(c.parsed.y)} couriers (${c.dataset._pct[c.dataIndex]})` },
        },
      },
      scales: {
        x: { grid: { display: false } },
        y: { beginAtZero: true, grid: { color: "rgba(255,255,255,0.05)" }, ticks: { callback: v => fmt(v) } },
      },
    },
  });
  root.querySelector(".weekly-bucket-meta").textContent =
    selectedWeeks.map(w => `${w.label.split("·")[0].trim()}: ${fmt(sumValues(w.do_summary))}`).join(" · ");

  buildBucketTable(
    root.querySelector(".weeklyBucketsTable"),
    DO_SUMMARY_BUCKETS,
    selectedWeeks.map(w => ({ label: w.label.split("·")[0].trim() + " " + w.label.split("·")[1].trim(), suffix: "couriers" })),
    (i, b) => selectedWeeks[i].do_summary[b] || 0,
    selectedWeeks.map(w => sumValues(w.do_summary))
  );
}

function sumValues(obj) {
  return Object.values(obj).reduce((a, b) => a + (b || 0), 0);
}

function renderDailyKpis(root, city) {
  const state = cityState.get(city.name);
  const el = root.querySelector(".kpis-grid");
  el.innerHTML = city.dates.map(d => {
    const t = city.daily_totals[d];
    return `
      <div class="kpi" data-day="${d}">
        <div class="label"><span class="wd">${weekdayOf(city, d)}</span> · ${shortDate(d)}</div>
        <div class="value">${fmt(t.active_couriers)}</div>
        <div class="meta">${fmt(Math.round(t.total_delivered))} DO</div>
      </div>`;
  }).join("");
  el.addEventListener("click", (ev) => {
    const card = ev.target.closest(".kpi");
    if (!card) return;
    const d = card.dataset.day;
    if (state.selectedDays.has(d)) state.selectedDays.delete(d);
    else state.selectedDays.add(d);
    rerenderDays(root, city);
  });
}

function renderDayTabs(root, city) {
  const el = root.querySelector(".weekTabs");
  el.innerHTML = city.weeks.map(w => `
    <div class="weekrow">
      <span class="week-label">${w.label.split("·")[0].trim()}</span>
      ${w.dates.map(d => `
        <button class="tab" data-day="${d}">
          <span class="wd">${weekdayOf(city, d)}</span>
          <span class="dt">${shortDate(d)}</span>
        </button>
      `).join("")}
    </div>
  `).join("");
  const state = cityState.get(city.name);
  el.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".tab");
    if (!btn) return;
    const d = btn.dataset.day;
    if (state.selectedDays.has(d)) state.selectedDays.delete(d);
    else state.selectedDays.add(d);
    rerenderDays(root, city);
  });
}

function renderDayQuickFilters(root, city) {
  const el = root.querySelector(".dqf");
  const wds = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const weekButtons = city.weeks.map((w, i) =>
    `<button class="qf" data-action="week" data-week="${i}">${w.label.split("·")[0].trim()} only</button>`
  ).join("");
  el.innerHTML = `
    <button class="qf" data-action="all">All days</button>
    ${weekButtons}
    <span class="qf-sep"></span>
    ${wds.map(w => `<button class="qf primary" data-action="weekday" data-wd="${w}">Compare ${w}</button>`).join("")}
    <span class="qf-sep"></span>
    <button class="qf" data-action="clear">Clear</button>
  `;
  const state = cityState.get(city.name);
  el.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".qf");
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === "all") state.selectedDays = new Set(city.dates);
    else if (action === "week") state.selectedDays = new Set(city.weeks[+btn.dataset.week].dates);
    else if (action === "weekday") {
      const wd = btn.dataset.wd;
      state.selectedDays = new Set(city.dates.filter(d => weekdayOf(city, d) === wd));
    } else if (action === "clear") state.selectedDays = new Set();
    rerenderDays(root, city);
  });
}

function rerenderDays(root, city) {
  const state = cityState.get(city.name);
  root.querySelectorAll(".kpi").forEach(el => {
    el.classList.toggle("selected", state.selectedDays.has(el.dataset.day));
  });
  root.querySelectorAll(".tab").forEach(el => {
    el.classList.toggle("active", state.selectedDays.has(el.dataset.day));
  });

  const sel = city.dates.filter(d => state.selectedDays.has(d));
  const titleEl = root.querySelector(".compare-title");
  titleEl.textContent = sel.length === 0
    ? "Select at least one day above"
    : sel.length === 1
      ? `Daily distribution · ${weekdayOf(city, sel[0])} ${sel[0]}`
      : `Compare ${sel.length} days`;

  const metaEl = root.querySelector(".compare-meta");
  metaEl.innerHTML = sel.map(d =>
    `${weekdayOf(city, d)} ${shortDate(d)}: <b>${fmt(city.daily_totals[d].active_couriers)}</b>`
  ).join(" · ");

  const canvas = root.querySelector(".dailyCompareChart");
  const tableEl = root.querySelector(".dailyCompareTable");

  if (sel.length === 0) {
    if (canvas._chart) { canvas._chart.destroy(); canvas._chart = null; }
    tableEl.innerHTML = "";
    return;
  }

  const datasets = sel.map((d, i) => {
    const total = city.daily_totals[d].active_couriers;
    const data = DO_BUCKETS.map(b => (city.do_daily[d] || {})[b] || 0);
    const weekIdx = city.weeks.findIndex(w => w.dates.includes(d));
    return {
      label: `${weekdayOf(city, d)} ${shortDate(d)}`,
      data,
      backgroundColor: PALETTE[weekIdx % PALETTE.length],
      borderRadius: 4,
      maxBarThickness: 28,
      _pct: data.map(v => pctStr(v, total)),
    };
  });
  newChart(canvas, {
    type: "bar",
    data: { labels: DO_BUCKETS, datasets },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: { position: "bottom", labels: { boxWidth: 10, boxHeight: 10 } },
        tooltip: {
          callbacks: { label: c => `${c.dataset.label}: ${fmt(c.parsed.y)} couriers (${c.dataset._pct[c.dataIndex]})` },
        },
      },
      scales: {
        x: { grid: { display: false } },
        y: { beginAtZero: true, grid: { color: "rgba(255,255,255,0.05)" }, ticks: { callback: v => fmt(v) } },
      },
    },
  });
  buildBucketTable(
    tableEl,
    DO_BUCKETS,
    sel.map(d => ({ label: `${weekdayOf(city, d)} ${shortDate(d)}`, suffix: "cou" })),
    (i, b) => (city.do_daily[sel[i]] || {})[b] || 0,
    sel.map(d => city.daily_totals[d].active_couriers)
  );
}

function renderStacked(root, city) {
  const canvas = root.querySelector(".stackedChart");
  const datasets = DO_BUCKETS.map((b, i) => ({
    label: b,
    backgroundColor: STACK_PALETTE[i % STACK_PALETTE.length],
    data: city.dates.map(d => {
      const total = city.daily_totals[d].active_couriers;
      return pct((city.do_daily[d] || {})[b] || 0, total);
    }),
  }));
  const labels = city.dates.map(d => `${weekdayOf(city, d)} ${shortDate(d)}`);
  newChart(canvas, {
    type: "bar",
    data: { labels, datasets },
    options: {
      maintainAspectRatio: false,
      plugins: {
        legend: { position: "bottom", labels: { boxWidth: 10, boxHeight: 10 } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y.toFixed(1)}%` } },
      },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { maxRotation: 75, minRotation: 75, autoSkip: false } },
        y: { stacked: true, beginAtZero: true, max: 100, grid: { color: "rgba(255,255,255,0.05)" }, ticks: { callback: v => v + "%" } },
      },
    },
  });
}

function showCity(name) {
  const city = DATA.cities.find(c => c.name === name);
  if (!city) return;
  if (!cityState.has(city.name)) initCity(city);

  const tpl = document.getElementById("cityTemplate");
  const root = tpl.content.firstElementChild.cloneNode(true);
  const container = document.getElementById("cityContent");
  destroyCharts(container);
  container.innerHTML = "";
  container.appendChild(root);

  renderWeeklyTotals(root, city);
  renderDailyKpis(root, city);
  renderDayTabs(root, city);
  renderDayQuickFilters(root, city);
  renderStacked(root, city);
  rerenderDays(root, city);
}

DATA.cities.forEach(initCity);
renderSubline();
renderCityTabs();
showCity(DATA.cities[0].name);
</script>
</body>
